[package]
name = "paypercall-registry"
description = "On-chain registry of paid PayPerCall APIs, so agents can discover them without a central marketplace."
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
